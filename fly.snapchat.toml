# Snapchat sidecar on Fly.io. "app" must be unique on Fly. Deploy with:
#   fly deploy -c fly.snapchat.toml --dockerfile snapchat-service/Dockerfile ./snapchat-service
app = "ariana-snap"
primary_region = "sjc"

[build]
  dockerfile = "snapchat-service/Dockerfile"

[env]
  PORT = "8080"
  SNAP_POLL_SECONDS = "20"
  SNAP_MAX_SENDS_PER_HOUR = "30"
  # Secrets (fly secrets set ...): SNAP_API_SECRET, MAIN_APP_URL, SNAPCHAT_USER_UUID, SNAPCHAT_CONVERSATIONS

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # polling loop must keep running
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/ping"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

name: Deploy WhatsApp sidecar to Fly
on:
  push:
    branches: [main]
    paths: ["wa-web.js", "Dockerfile.wa", "fly.toml", "package.json", "package-lock.json"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
